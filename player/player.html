<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRStream Studio - 多屏直播监控工作台</title>
  <link rel="stylesheet" href="player.css">
  <script src="../vendor/hls.min.js"></script>
  <script src="../vendor/mux.min.js"></script>
</head>
<body class="theme-dark">
  <div class="workspace-layout">
    <!-- 左侧：关注主播与控制台 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-prefix">KR</span>
          <span class="brand-name">STREAM</span>
          <span class="brand-version">PRO</span>
        </div>
        <button class="btn-icon" id="btn-toggle-sidebar" title="收起边栏">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M10 3L5 8l5 5"/>
          </svg>
        </button>
      </div>

      <!-- 账号凭证与状态面板 -->
      <div class="accounts-card">
        <div class="accounts-header">
          <span class="section-label">PLATFORM ACCOUNTS</span>
        </div>
        <div class="accounts-grid">
          <div class="acc-badge" id="acc-soop" title="SOOP 账号">
            <span class="status-dot"></span>
            <span class="name">SOOP: 检测中...</span>
          </div>
          <div class="acc-badge" id="acc-chzzk" title="Chzzk Naver 账号">
            <span class="status-dot"></span>
            <span class="name">CHZZK: 检测中...</span>
          </div>
          <div class="acc-badge" id="acc-cime" title="CI.ME 账号">
            <span class="status-dot"></span>
            <span class="name">CI.ME: 检测中...</span>
          </div>
        </div>
        <button class="btn-primary btn-sync-all" id="btn-sync-all">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M1.5 8a6.5 6.5 0 0111.4-4.3L14.5 5M14.5 1.5V5h-3.5M14.5 8a6.5 6.5 0 01-11.4 4.3L1.5 11M1.5 14.5V11H5"/>
          </svg>
          <span id="sync-btn-text">同步关注</span>
        </button>
      </div>

      <!-- 直播源输入 -->
      <div class="sidebar-search">
        <input type="text" id="custom-stream-input" placeholder="直播链接或主播 ID" spellcheck="false" autocomplete="off" />
        <button id="btn-custom-play" class="btn-secondary">播放</button>
      </div>

      <!-- 过滤标签 -->
      <div class="filter-tabs">
        <button class="filter-btn active" data-filter="all">全部 <span class="tab-count" id="count-all">0</span></button>
        <button class="filter-btn highlight" data-filter="live"><span class="live-dot-inline"></span>直播 <span class="tab-count" id="count-live">0</span></button>
        <button class="filter-btn" data-filter="soop">SOOP <span class="tab-count" id="count-soop">0</span></button>
        <button class="filter-btn" data-filter="chzzk">CHZZK <span class="tab-count" id="count-chzzk">0</span></button>
        <button class="filter-btn" data-filter="cime">CI.ME <span class="tab-count" id="count-cime">0</span></button>
      </div>

      <!-- 主播列表容器 -->
      <div class="streamer-list" id="streamer-list">
        <div class="empty-state">暂无主播</div>
      </div>
    </aside>

    <!-- 右侧：多屏视口主界面 -->
    <div class="main-content">
      <!-- 顶部控制条 -->
      <header class="top-bar">
        <div class="top-left">
          <!-- 布局模板管理器 -->
          <div class="layout-template-bar">
            <span class="layout-label">布局模板</span>
            <select class="template-select" id="template-select" title="选择模板">
              <option value="current">当前工作区</option>
            </select>
            <button class="btn-secondary" id="btn-save-template" title="保存模板">
              <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M3 2h8l3 3v9H2V2h1zM4 2v4h6V2M5 14v-5h6v5"/>
              </svg>
              <span>保存模板</span>
            </button>
            <button class="btn-subtle" id="btn-delete-template" title="删除模板" style="display:none;">删除模板</button>
          </div>

          <button class="btn-secondary" id="btn-add-window" title="新增窗口">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M8 2v12M2 8h12"/>
            </svg>
            <span>新增窗口</span>
          </button>
        </div>

        <div class="top-right">
          <button class="btn-subtle" id="btn-clear-all" title="清空窗口">清空网格</button>
        </div>
      </header>

      <!-- 动态多屏网格视口 -->
      <div class="viewport-grid layout-1" id="viewport-grid">
        <!-- 窗口由 SlotManager 动态管理 -->
      </div>
    </div>

    <!-- 左侧收起后浮动展开按钮 -->
    <button class="sidebar-expand-tab" id="btn-expand-sidebar" title="展开主播列表">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M6 3l5 5-5 5"/>
      </svg>
      <span>主播列表</span>
    </button>

    <!-- 右侧：字幕历史与长图导出侧边抽屉 -->
    <aside class="right-drawer" id="right-drawer">
      <div class="drawer-header">
        <div class="drawer-title">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M2.5 3.5h11M2.5 7h7M2.5 10.5h11M2.5 14h6"/>
          </svg>
          <span>历史字幕</span>
        </div>
        <div class="drawer-header-actions">
          <select class="drawer-slot-select" id="drawer-slot-select" title="选择窗口"></select>
          <button class="btn-icon" id="btn-close-right-drawer" title="收起">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M4 4l8 8M12 4l-8 8"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="drawer-toolbar">
        <div class="drawer-search-bar">
          <input type="text" id="sub-search-input" placeholder="搜索字幕..." spellcheck="false" autocomplete="off" />
        </div>
        <div class="drawer-batch-actions">
          <div class="batch-select-wrap">
            <button class="btn-chip" id="btn-sub-select-all">全选</button>
            <button class="btn-chip" id="btn-sub-clear-select">清空</button>
            <span class="selected-count-label" id="selected-sub-count">已选: 0</span>
          </div>
          <button class="btn-primary btn-gen-long-image" id="btn-gen-long-image" title="生成字幕长图">
            <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="2" y="2" width="12" height="12" rx="1.5"/>
              <path d="M2 11l3.5-3.5a1 1 0 011.4 0l4.5 4.5"/>
              <circle cx="5" cy="5.5" r="1"/>
            </svg>
            <span>生成长图</span>
          </button>
        </div>
      </div>

      <div class="drawer-sub-list" id="drawer-sub-list">
        <div class="sub-empty-tip">暂无字幕</div>
      </div>
    </aside>

    <!-- 字幕长图生成模态弹窗 -->
    <div class="modal-overlay" id="modal-long-image" style="display:none;">
      <div class="modal-box long-image-modal-box">
        <div class="modal-header">
          <div class="modal-title">字幕长图</div>
          <button class="btn-icon" id="btn-close-modal">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M4 4l8 8M12 4l-8 8"/>
            </svg>
          </button>
        </div>
        <div class="modal-body long-image-modal-body">
          <div class="long-image-preview-wrap">
            <canvas id="long-image-canvas" style="display:none;"></canvas>
            <img id="long-image-preview-img" alt="字幕长图预览" />
          </div>
        </div>
        <div class="modal-footer">
          <div class="long-image-opts">
            <label><input type="radio" name="long-img-style" value="movie" checked> 台词切片</label>
            <label><input type="radio" name="long-img-style" value="stacked"> 全图平铺</label>
          </div>
          <div class="modal-btn-group">
            <button class="btn-secondary" id="btn-copy-long-image">复制</button>
            <button class="btn-primary" id="btn-download-long-image">下载 PNG</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="player.js"></script>
</body>
</html>
